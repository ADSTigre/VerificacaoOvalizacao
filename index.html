<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Tubos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>📏 Controle de Tubos</h1>

<div class="card">

<label>Data</label>
<input type="text"
       id="data"
       placeholder="dd/mm/aaaa">


<label>Turno</label>
<select id="turno">
    <option value="">Selecionar</option>
    <option value="1">Turno 1</option>
    <option value="2">Turno 2</option>
    <option value="3">Turno 3</option>
</select>

<label>Medição 1 (mm)</label>
<input type="number" id="medicao1" step="0.01">


<label>Medição 2 (mm)</label>
<input type="number" id="medicao2" step="0.01">

<div id="resultado">
    Diferença: -
</div>

<div id="status">
    Status: -
</div>

<button onclick="salvarMedicao()">
    Salvar Medição
</button>

</div>

<script type="module" src="app.js"></script>
<div class="resumo">

<h2>Resumo</h2>

<p>✅ Aprovados: <span id="aprovados">0</span></p>
<p>🟡 Retrabalho: <span id="retrabalho">0</span></p>
<p>🔴 Refugo: <span id="refugo">0</span></p>

</div>

<div class="acoes">

<button onclick="filtrar('Todos')">Todos</button>
<button onclick="filtrar('Aprovado')">Aprovados</button>
<button onclick="filtrar('Retrabalho')">Retrabalho</button>
<button onclick="filtrar('Refugo')">Refugo</button>

</div>

<button class="exportar" onclick="exportarPDF()">
    📄 Exportar PDF
</button>

<h2>Histórico</h2>

<div id="historico"></div>

</div>

<script src="app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getFirestore,
 collection,
 addDoc,
 getDocs,
 deleteDoc,
 doc
}
from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

</script>
</body>
</html>
